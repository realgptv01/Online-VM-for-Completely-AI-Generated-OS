<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI OS VM</title>
</head>
<body style="background-color: #000; color: #0f0; font-family: monospace;">

    <div id="screen_container">
        <div style="white-space: pre;"></div>
        <canvas style="display: none"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/v86/build/libv86.js"></script>
    
    <script>
        window.onload = function() {
            // This checks if the library actually loaded from the web
            if (typeof V86Starter === "undefined") {
                alert("Critical Error: The VM engine (libv86) could not load!");
                return;
            }

            var emulator = new V86Starter({
                // We use the CDN for the WASM part too for stability
                wasm_path: "https://cdn.jsdelivr.net/npm/v86/build/v86.wasm",
                memory_size: 128 * 1024 * 1024,
                vga_bios: { url: "VGABIOS-lgpl-latest.bin" }, 
                bios: { url: "seabios.bin" },
                cdrom: { url: "myos.iso" },
                autostart: true,
                screen_container: document.getElementById("screen_container"),
            });
            
            console.log("VM initialized with CDN files.");
        };
    </script>
</body>
</html>
